config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/nginx-*.log
        multiline.parser docker, cri
        Tag kube.var.log.containers.nginx
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name stdout
        Match *
        Format json_lines